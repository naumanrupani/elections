<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Election Explorer</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--card:#f7f8fa;--text:#18212f;--muted:#687386;--border:#d9dfe8;--accent:#3157c8}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
main{width:960px;margin:22px auto}.slide{width:960px;height:540px;background:var(--panel);border:1px solid var(--border);border-radius:14px;display:grid;grid-template-rows:82px 330px 128px;overflow:hidden}
.title{display:flex;align-items:center;justify-content:center;padding:12px 28px;border-bottom:1px solid var(--border);font-size:30px;font-weight:800;text-align:center}
.visual{display:flex;align-items:center;justify-content:center;padding:22px 34px;overflow:hidden}
.bottom{border-top:2px solid var(--border);padding:16px 34px;display:flex;align-items:center;background:var(--card);font-size:18px;line-height:1.5}.bottom p{margin:0}
.controls{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px}button{min-height:44px;border:1px solid var(--border);border-radius:10px;padding:8px 18px;background:var(--card);color:var(--text);font-weight:700;font-size:16px;cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.38;cursor:default}.counter{font-size:14px;color:var(--muted);font-weight:700}
.flow{width:100%;display:grid;grid-template-columns:1fr 38px 1.25fr 38px 1fr 38px 1fr;align-items:center;gap:4px}.concept{text-align:center}.icon{font-size:66px;line-height:1.05;margin-bottom:10px}.word{font-size:19px;font-weight:800}.arrow{text-align:center;font-size:32px;color:var(--muted)}.candidates{display:flex;justify-content:center;gap:9px;margin-bottom:10px}.candidate{width:70px;height:70px;border:2px solid var(--border);border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:45px}
.two{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:700px}.card{border:2px solid var(--border);border-radius:16px;background:var(--card);padding:16px;text-align:center}.big{font-size:72px;line-height:1.1}.label{font-size:20px;font-weight:800;margin-top:7px}.mini{font-size:17px;margin-top:5px;color:var(--muted)}.policy{font-size:62px;margin-bottom:8px}
.choiceRow{display:flex;justify-content:center;align-items:center;gap:40px;width:100%}.personChoice{text-align:center;font-size:60px}.personChoice span{display:block;font-size:44px;margin-top:8px}.result{display:flex;align-items:center;justify-content:center;gap:55px}.score{text-align:center}.score .num{font-size:54px;font-weight:900}.winner{font-size:26px;font-weight:900;margin-top:10px}
.zoom{display:flex;align-items:center;justify-content:center;gap:22px}.zoomItem{text-align:center}.zoomIcon{font-size:64px}.zoomLabel{font-size:19px;font-weight:800;margin-top:6px}
.memoryMap{display:flex;align-items:center;justify-content:center;gap:28px;width:100%}.memoryItem{text-align:center;min-width:160px}.memoryItem .mi{font-size:68px}.memoryItem b{display:block;font-size:21px}.memoryItem span{font-size:17px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;width:100%;max-width:760px}.fact{text-align:center;border:2px solid var(--border);border-radius:16px;padding:18px;background:var(--card)}.fact .ficon{font-size:55px}.fact .fmain{font-size:24px;font-weight:900;margin-top:7px}
.timeline{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}.year{text-align:center;border:2px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--card);min-width:115px}.year strong{display:block;font-size:25px}.year span{font-size:15px;color:var(--muted)}
.vote-simple{display:flex;align-items:center;justify-content:center;gap:100px}.voteItem{text-align:center}.voteIcon{font-size:92px}.voteLabel{font-size:23px;font-weight:800;margin-top:14px}
.privacy{display:grid;grid-template-columns:1fr 1fr;gap:38px;width:100%;max-width:700px}.privacyItem{text-align:center}.privacyItem .pi{font-size:76px}.privacyItem b{display:block;font-size:21px;margin-top:8px}.privacyItem span{display:block;color:var(--muted);margin-top:5px}
.review{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;width:100%;max-width:800px}.review .r{text-align:center}.review .ri{font-size:46px}.review b{display:block;font-size:16px}.review span{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
<section class="slide">
<header id="title" class="title"></header>
<div id="visual" class="visual"></div>
<footer id="bottom" class="bottom"></footer>
</section>
<div class="controls"><button id="prev">← Back</button><div id="counter" class="counter"></div><button id="next" class="primary">Next →</button></div>
</main>
<script>
const slides=[
{t:'What is an election?',v:`<div class="flow"><div class="concept"><div class="icon">🧑‍🤝‍🧑</div><div class="word">VOTERS</div></div><div class="arrow">→</div><div class="concept"><div class="candidates"><div class="candidate">👩</div><div class="candidate">👨</div></div><div class="word">CANDIDATES</div></div><div class="arrow">→</div><div class="concept"><div class="icon">📄✏️</div><div class="word">BALLOT</div></div><div class="arrow">→</div><div class="concept"><div class="icon">🗳️</div><div class="word">CHOICE</div></div></div>`,b:`An <strong>election</strong> is a way for a group of people to make a choice. People called <strong>voters</strong> choose between <strong>candidates</strong>. Voters make their choice using a <strong>ballot</strong>.`},
{t:'A school election',v:`<div class="two"><div class="card"><div class="big">👧</div><div class="label">MAYA</div><div class="policy">📚</div><div class="mini">Longer library hours</div></div><div class="card"><div class="big">👦</div><div class="label">LEO</div><div class="policy">⚽</div><div class="mini">More after-school activities</div></div></div>`,b:`Imagine that a school needs to choose a student representative. <strong>Maya</strong> wants longer library hours. <strong>Leo</strong> wants more after-school activities. They are both candidates, and <strong>different candidates can have different ideas.</strong>`},
{t:'Voters make their own choices',v:`<div class="choiceRow"><div class="personChoice">🧒<span>📚</span></div><div class="personChoice">👧<span>⚽</span></div><div class="personChoice">🧑<span>📚</span></div><div class="personChoice">👦<span>⚽</span></div></div>`,b:`Voters learn about the candidates and then make their own choice. One person may care more about the library, while another may care more about activities. <strong>Different people can prefer different things.</strong>`},
{t:'Vote → Count → Result',v:`<div><div class="result"><div class="score"><div class="big">👧</div><b>Maya</b><div class="num">7</div><span>votes</span></div><div class="big">🗳️</div><div class="score"><div class="big">👦</div><b>Leo</b><div class="num">5</div><span>votes</span></div></div><div class="winner" style="text-align:center">🏆 MAYA IS ELECTED</div></div>`,b:`Each student votes, and then the ballots are counted. Maya receives seven votes and Leo receives five. <strong>Maya received more votes, so Maya wins this election.</strong> She represents all the students, including those who voted for Leo.`},
{t:'Mayor: decisions about our town or city',v:`<div class="two"><div class="card"><div class="policy">🏫</div><div class="label">BUILD ANOTHER SCHOOL</div></div><div class="card"><div class="policy">🌳</div><div class="label">BUILD A NEW PARK</div></div></div>`,b:`A <strong>mayor helps lead a city or town</strong>. Candidates for mayor can have different ideas. One might want to build another school, while another might want to build a new park. Voters decide which candidate they prefer.`},
{t:'Governor: decisions about our state',v:`<div class="two"><div class="card"><div class="policy">🛣️ 🌉</div><div class="label">ROADS & BRIDGES</div></div><div class="card"><div class="policy">🏫</div><div class="label">HELP SCHOOLS</div></div></div>`,b:`A <strong>governor helps lead a state</strong>. One candidate might want to spend more money fixing roads and bridges. Another might want to spend more money helping schools. Voters can choose between those priorities.`},
{t:'President: decisions about our country',v:`<div class="facts"><div class="fact"><div class="ficon">🛡️</div><div class="fmain">Security</div></div><div class="fact"><div class="ficon">🌎</div><div class="fmain">Other countries</div></div><div class="fact"><div class="ficon">💵</div><div class="fmain">Economy</div></div></div>`,b:`The <strong>President helps lead the entire United States</strong>. Presidents deal with nationwide issues such as national security, working with other countries, the economy, and other matters that affect the country.`},
{t:'Three levels to remember',v:`<div class="memoryMap"><div class="memoryItem"><div class="mi">🏘️</div><b>MAYOR</b><span>City / Town</span></div><div class="arrow">→</div><div class="memoryItem"><div class="mi">🏛️</div><b>GOVERNOR</b><span>State</span></div><div class="arrow">→</div><div class="memoryItem"><div class="mi">🇺🇸</div><b>PRESIDENT</b><span>Country</span></div></div>`,b:`Here is an easy memory map: <strong>Mayor → City or Town. Governor → State. President → Country.</strong>`},
{t:'When are federal elections?',v:`<div class="facts"><div class="fact"><div class="ficon">2️⃣</div><div class="fmain">EVERY 2 YEARS</div></div><div class="fact"><div class="ficon">📅</div><div class="fmain">NOVEMBER</div></div><div class="fact"><div class="ficon">🗳️</div><div class="fmain">ELECTION DAY</div></div></div>`,b:`Federal general elections happen <strong>every two years</strong>. Federal Election Day is the <strong>Tuesday after the first Monday in November</strong>. That means Election Day falls between November 2 and November 8.`},
{t:'Presidential elections: every 4 years',v:`<div class="timeline"><div class="year"><strong>2024</strong><div>🇺🇸</div><span>President</span></div><div class="arrow">→</div><div class="year"><strong>2026</strong><div>🗳️</div><span>Federal election</span></div><div class="arrow">→</div><div class="year"><strong>2028</strong><div>🇺🇸</div><span>President</span></div><div class="arrow">→</div><div class="year"><strong>2030</strong><div>🗳️</div><span>Federal election</span></div></div>`,b:`Federal elections happen every two years, but Americans elect a President <strong>every four years</strong>. A presidential term lasts four years.`},
{t:'A real example: the 2024 presidential election',v:`<div class="timeline"><div class="year"><strong>2024</strong><div class="big">🗳️</div><span>Election</span></div><div class="arrow">→</div><div class="year" style="min-width:190px"><div class="big">🏆</div><strong style="font-size:20px">Donald Trump</strong><span>Won the election</span></div><div class="arrow">→</div><div class="year"><strong>2028</strong><div class="big">🇺🇸</div><span>Next presidential election</span></div></div>`,b:`In <strong>2024</strong>, Americans held a presidential election, and <strong>Donald Trump won the election</strong>. A presidential term lasts four years. The next presidential election is in <strong>2028</strong>.`},
{t:'Who can vote?',v:`<div class="vote-simple"><div class="voteItem"><div class="voteIcon">🇺🇸</div><div class="voteLabel">U.S. CITIZEN</div></div><div style="font-size:46px;color:var(--muted)">+</div><div class="voteItem"><div class="voteIcon">🔞</div><div class="voteLabel">18 OR OLDER</div></div></div>`,b:`To vote in U.S. federal elections, you must be a <strong>U.S. citizen</strong> and meet the voting age requirement: <strong>18 years old by Election Day</strong>.`},
{t:'Your voting choice is personal',v:`<div class="privacy"><div class="privacyItem"><div class="pi">🙋 🗳️ 🔒</div><b>MY VOTE</b><span>I decide whether to share it</span></div><div class="privacyItem"><div class="pi">👨‍👦 🔒</div><b>SOMEONE ELSE'S VOTE</b><span>They decide whether to share it</span></div></div>`,b:`Your voting choice is <strong>personal</strong>. You may tell someone how you voted if you want to, but you do not have to. If someone lets you see their vote, <strong>they decide whether their choice should be shared.</strong>`},
{t:'If Dad lets me see his ballot',v:`<div class="zoom"><div class="zoomItem"><div class="zoomIcon">👨</div><div class="zoomLabel">DAD</div></div><div class="arrow">→</div><div class="zoomItem"><div class="zoomIcon">🗳️ 👀</div><div class="zoomLabel">I SEE HIS CHOICE</div></div><div class="arrow">→</div><div class="zoomItem"><div class="zoomIcon">🤐 🔒</div><div class="zoomLabel">KEEP IT PRIVATE</div></div></div>`,b:`If Dad lets me see his ballot, I have learned <strong>Dad's private information</strong>. Dad decides whether he wants other people to know his choice. <strong>I don't tell other people how Dad voted unless Dad says it is okay.</strong>`},
{t:'Election Explorer: remember these ideas',v:`<div class="review"><div class="r"><div class="ri">🏘️</div><b>MAYOR</b><span>Town / City</span></div><div class="r"><div class="ri">🏛️</div><b>GOVERNOR</b><span>State</span></div><div class="r"><div class="ri">🇺🇸</div><b>PRESIDENT</b><span>Country</span></div><div class="r"><div class="ri">2️⃣</div><b>ELECTIONS</b><span>Every 2 years</span></div><div class="r"><div class="ri">4️⃣</div><b>PRESIDENT</b><span>Every 4 years</span></div><div class="r"><div class="ri">🔞</div><b>VOTING AGE</b><span>18</span></div><div class="r"><div class="ri">🗳️</div><b>VOTE</b><span>Make a choice</span></div><div class="r"><div class="ri">🔒</div><b>PRIVACY</b><span>My choice is personal</span></div></div>`,b:`<strong>Candidates can have different ideas, and voters can make different choices.</strong> Voting is how voters make their choice. The votes are counted, someone is elected, and each person's voting choice is personal.`}
];
let i=0;
const title=document.getElementById('title'),visual=document.getElementById('visual'),bottom=document.getElementById('bottom'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter');
function render(){const s=slides[i];title.textContent=s.t;visual.innerHTML=s.v;bottom.innerHTML='<p>'+s.b+'</p>';counter.textContent=(i+1)+' of '+slides.length;prev.disabled=i===0;next.disabled=i===slides.length-1;next.textContent=i===slides.length-1?'Finished':'Next →'}
prev.addEventListener('click',()=>{if(i>0){i--;render()}});
next.addEventListener('click',()=>{if(i<slides.length-1){i++;render()}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&!prev.disabled)prev.click();if(e.key==='ArrowRight'&&!next.disabled)next.click()});
render();
</script>
</body>
</html>
